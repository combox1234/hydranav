[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# ──────────────────────────────────────────────
# Project Metadata (PEP 621)
# ──────────────────────────────────────────────

[project]
name = "hydranav"
version = "0.1.0"
description = "Computer Vision framework for Autonomous Surface Vehicle simulation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "HydraNav Contributors" },
]
keywords = [
    "computer-vision",
    "autonomous-surface-vehicle",
    "navigation",
    "simulation",
    "path-planning",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[project.urls]
Repository = "https://github.com/combox1234/hydranav"
Documentation = "https://github.com/combox1234/hydranav/tree/main/docs"
Issues = "https://github.com/combox1234/hydranav/issues"

# ──────────────────────────────────────────────
# Package Discovery
# ──────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["src"]

# ──────────────────────────────────────────────
# Ruff
# ──────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["hydranav"]

# ──────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ──────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────

[tool.coverage.run]
source = ["hydranav"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 0
